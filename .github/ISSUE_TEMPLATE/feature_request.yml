name: Feature idea
description: Suggest something new for Kestrel
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the problem or the thing you wish Kestrel could do.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could it work?
      description: Rough ideas, mockups or examples from other apps are all helpful.
